name: Release

# Run by hand from the Actions tab: tests Urras, builds ready-to-run downloads for Windows and Linux, and publishes
# them as a GitHub release tagged with the <Version> in src/Urras.App/Urras.App.csproj
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core tests
        run: dotnet run --project tests/Urras.Core.Tests -c Release

      - name: Interface tests (Avalonia headless)
        run: dotnet test tests/Urras.App.Tests -c Release

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Stops early when that version was already released, so a release is never overwritten
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Urras.App/Urras.App.csproj)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::v$version is already released; raise <Version> in Urras.App.csproj first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, version]
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # One self-contained file per system: nothing else to install, .NET included
      - name: Publish
        shell: bash
        run: >-
          dotnet publish src/Urras.App -c Release -r ${{ matrix.runtime }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.version.outputs.version }} -o publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path publish/*
          -DestinationPath "Urras-v${{ needs.version.outputs.version }}-${{ matrix.runtime }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "Urras-v${{ needs.version.outputs.version }}-${{ matrix.runtime }}.tar.gz" -C publish .

      - uses: actions/upload-artifact@v4
        with:
          name: urras-${{ matrix.runtime }}
          path: |
            Urras-*.zip
            Urras-*.tar.gz

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      # The tag is made on the commit that was built
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          if [[ "${{ inputs.prerelease }}" == "true" || "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" downloads/* --target "$GITHUB_SHA" --title "Urras $VERSION" \
            --generate-notes $prerelease
