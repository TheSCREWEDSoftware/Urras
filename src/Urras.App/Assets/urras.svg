<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.45" stop-color="#7fd8ff"/>
      <stop offset="1" stop-color="#1f8fe0"/>
    </linearGradient>
    <linearGradient id="iceDark" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe4ff"/>
      <stop offset="1" stop-color="#1468b8"/>
    </linearGradient>
    <linearGradient id="wind" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfeeff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfeeff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bfeeff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- wind streaks -->
  <path d="M18 92 C70 74 120 76 168 60" fill="none" stroke="url(#wind)" stroke-width="7" stroke-linecap="round"/>
  <path d="M40 206 C96 198 150 182 230 150" fill="none" stroke="url(#wind)" stroke-width="6" stroke-linecap="round"/>
  <path d="M10 150 C50 142 80 140 112 128" fill="none" stroke="url(#wind)" stroke-width="5" stroke-linecap="round"/>
  <!-- main shard: two faces -->
  <polygon points="150,22 176,64 128,214 112,176" fill="url(#ice)"/>
  <polygon points="176,64 196,92 128,214" fill="url(#iceDark)"/>
  <!-- left shard -->
  <polygon points="66,70 92,96 104,196 74,150" fill="url(#ice)"/>
  <polygon points="92,96 112,118 104,196" fill="url(#iceDark)"/>
  <!-- right shard -->
  <polygon points="214,112 226,136 152,218 170,170" fill="url(#ice)"/>
  <polygon points="226,136 236,150 152,218" fill="url(#iceDark)"/>
  <!-- small flying shards -->
  <polygon points="44,40 58,50 54,80 40,62" fill="url(#ice)"/>
  <polygon points="208,40 222,46 206,74 200,62" fill="url(#ice)"/>
  <polygon points="30,176 46,180 58,214 40,204" fill="url(#iceDark)"/>
  <!-- burst base -->
  <polygon points="72,224 128,206 184,226 128,236" fill="#1468b8" opacity="0.55"/>
  <!-- highlights -->
  <polyline points="150,30 120,174" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <polyline points="70,78 80,140" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="214,118 174,168" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
